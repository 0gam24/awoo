version: 2

# Dependabot — 의존성 자동 업데이트 PR
# - npm: 매주 보안 패치 수동 검수 부담 감소
# - github-actions: third-party 액션 핀(현재 @v4 rolling tag) 정기 업데이트
# - 기본 group ed PR로 노이즈 최소화
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'thursday'
      time: '04:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
    ignore:
      # astro 7 + @astrojs/cloudflare 14 조합은 output:'static'+어댑터 구성에서
      # "Could not find the prerender entry point" 빌드 실패 (2026-08-09 워크트리 재현,
      # 최신 7.2.0+14.2.0도 동일). 메이저 업그레이드는 수동 마이그레이션으로만 진행.
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns:
          - '@astrojs/*'
          - 'astro'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
      tooling:
        patterns:
          - '@biomejs/*'
          - 'typescript'
          - 'vite'
          - 'wrangler'
          - 'lefthook'
      lighthouse:
        patterns:
          - '@lhci/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'thursday'
      time: '04:00'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'github-actions'
