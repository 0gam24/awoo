# awoo 0400 자동 발행 PR 자동 병합
#
# 배경: 클라우드 루틴 'awoo 0400'(매일 KST 04:00)은 main 직접 push 권한이 없어
# claude/* 브랜치로 PR을 연다. 이 워크플로가 운영자 승인을 대신해
# [콘텐츠 파일만 변경 + 게이트 체크 전부 성공] 조건을 검증하고 자동 병합한다.
# (운영자 지시 2026-08-28: 새벽 자동 발행 1건은 승인 없이 온라인 공개까지 전권)
#
# 안전장치:
#   - 같은 저장소의 claude/* 브랜치 + 제목에 '0400 자동 발행' 포함 PR만 대상 (fork 불가)
#   - 변경 파일이 src/data/issues/** 와 today.md 뿐일 때만 병합 — 코드·설정·워크플로 변경이
#     끼어 있으면 절대 병합하지 않고 라벨만 남긴다
#   - 아래 GATE_CHECKS 의 체크가 전부 success 여야 병합 (하나라도 실패면 코멘트만 남기고 중단)
#     2026-08-31: CI 'Lint · Typecheck · Build · Lighthouse 4×100' 을 게이트에 편입.
#     기존에 제외했던 이유(main HEAD 자체 실패) 3건을 모두 처리했다 —
#       (1) GA4·AdSense·wcslog 의 서드파티 쿠키로 best-practices 0.74 고정
#           → lighthouserc.json blockedUrlPatterns 로 CI 측정에서만 차단
#       (2) 정적 서버에 없는 /api/vitals 404 가 errors-in-console 0점
#           → src/lib/vitals.ts 가 localhost 에서는 비콘 미전송
#       (3) footer h3 가 h1 뒤에 와서 heading-order 위반 → footer 레이블 h2
#     콘텐츠 PR에도 schema·번들 예산·LH 회귀 방어가 필요하므로 포함한다.
#   - 병합 후 신규 이슈 URL을 IndexNow에 자동 핑 (키는 public/<KEY>.txt — IndexNow 키는
#     공개가 전제인 값이라 시크릿 불필요)

name: Auto publish 0400

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-publish-0400-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      contains(github.event.pull_request.title, '0400 자동 발행')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 변경 파일이 콘텐츠뿐인지 검증
        id: files
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "$files"
          bad=0
          while IFS= read -r f; do
            case "$f" in
              src/data/issues/*|today.md) ;;
              *) echo "::warning::콘텐츠 외 파일 감지: $f"; bad=1 ;;
            esac
          done <<< "$files"
          if [ "$bad" = "1" ]; then
            gh pr comment "$PR" --body "auto-publish-0400: 콘텐츠 외 파일이 포함돼 자동 병합을 중단합니다. 운영자 수동 검토가 필요합니다."
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 게이트 체크 전부 성공 대기 (최대 20분)
        if: steps.files.outputs.content_only == 'true'
        id: gate
        run: |
          # Workers Builds  = 실제 배포 산출물이 빌드되는지
          # CI(4×100)      = biome·astro check·lint:content(schema)·JS 예산·Lighthouse 회귀
          GATE_CHECKS=(
            "Workers Builds: awoo"
            "Lint · Typecheck · Build · Lighthouse 4×100"
          )

          abort() {
            gh pr comment "$PR" --body "auto-publish-0400: $1"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          for i in $(seq 1 40); do
            gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" > "$RUNNER_TEMP/checks.json"
            pending=0
            for name in "${GATE_CHECKS[@]}"; do
              # 같은 SHA에 동명 체크가 여러 개 붙을 수 있다(브랜치 2개·재실행).
              # 하나라도 success면 통과, 아직 도는 게 있으면 대기, 전부 끝났는데 success가
              # 없으면 중단.
              states=$(jq -r --arg n "$name" \
                '[.check_runs[] | select(.name == $n) | (.conclusion // .status // "unknown")] | join(" ")' \
                "$RUNNER_TEMP/checks.json")
              echo "[$i/40] $name = ${states:-(없음)}"
              case " $states " in
                *" success "*) ;;
                *" queued "*|*" in_progress "*|*" waiting "*|*" pending "*|*" requested "*) pending=1 ;;
                "  ") pending=1 ;;
                *) abort "'$name' 체크가 [$states] 라 자동 병합을 중단합니다." ;;
              esac
            done
            if [ "$pending" = "0" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          abort "게이트 체크가 20분 내에 끝나지 않아 자동 병합을 중단합니다."

      - name: draft 해제 후 squash 병합
        if: steps.files.outputs.content_only == 'true' && steps.gate.outputs.ok == 'true'
        id: merge
        run: |
          gh pr ready "$PR" || true
          gh pr merge "$PR" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: 저장소 체크아웃 (IndexNow 키·URL 파생용)
        if: steps.merge.outputs.merged == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 신규 이슈 URL IndexNow 핑
        if: steps.merge.outputs.merged == 'true'
        run: |
          KEY=$(ls public/ | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          if [ -z "$KEY" ]; then echo "::warning::IndexNow 키 파일 없음 — 핑 생략"; exit 0; fi
          urls=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate \
            --jq '.[] | select(.status == "added") | .filename' \
            | grep -E '^src/data/issues/[0-9]{4}-[0-9]{2}-[0-9]{2}/.+\.json$' \
            | sed -E 's#^src/data/issues/[0-9-]+/##; s#-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$##' \
            | sed 's#^#"https://awoo.or.kr/issues/#; s#$#/"#' | paste -sd, -)
          if [ -z "$urls" ]; then echo "신규 이슈 파일 없음 (갱신 전용 PR) — 핑 생략"; exit 0; fi
          echo "ping: $urls"
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"awoo.or.kr\",\"key\":\"$KEY\",\"keyLocation\":\"https://awoo.or.kr/$KEY.txt\",\"urlList\":[$urls]}" \
            -w "\nHTTP %{http_code}\n"
