name: IndexNow ping

# 배포(Deploy (Cloudflare Workers))가 성공한 뒤 색인 알림 — 네이버 서치어드바이저 + IndexNow 공용 창구
# - 네이버 가이드: 공개돼 200을 주는 URL만, 새로 생기거나 바뀐 URL만 보낸다
# - 직전 상태(.indexnow-state.json)는 actions/cache로 이어받는다(예전엔 저장이 안 돼 매번 704건 전체 재전송)
# - INDEXNOW_KEY secret 미설정 시 graceful skip
on:
  workflow_run:
    workflows: ['Deploy (Cloudflare Workers)']
    types: [completed]
  workflow_dispatch:
    inputs:
      seed:
        description: '보내지 않고 현재 사이트맵을 상태로만 기록'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: indexnow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Build + IndexNow submit
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Skip if INDEXNOW_KEY missing
        id: gate
        env:
          KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning title=IndexNow::INDEXNOW_KEY secret 미설정 — skip (docs/ops/INDEXNOW.md 참조)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.gate.outputs.skip == 'false'
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Restore IndexNow state
        if: steps.gate.outputs.skip == 'false'
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      - name: Build
        if: steps.gate.outputs.skip == 'false'
        run: npm run build

      - name: IndexNow ping
        if: steps.gate.outputs.skip == 'false'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ "${{ inputs.seed }}" = "true" ]; then npm run indexnow:ping -- --seed; else npm run indexnow:ping; fi
        continue-on-error: true

      - name: Save IndexNow state
        if: always() && steps.gate.outputs.skip == 'false' && hashFiles('.indexnow-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}-${{ github.run_attempt }}
