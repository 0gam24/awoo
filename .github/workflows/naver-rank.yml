name: Naver rank check

# 발행한 글이 네이버에서 실제로 몇 위인지 매일 측정한다.
# 병목은 색인이 아니라 랭킹이므로, 이 측정값이 다음 글의 각도를 정하는 근거가 된다.
# KST 09:40 — 새벽 자동 발행(04:00) 결과가 색인될 시간을 준 뒤.
# 산출 src/data/naver-ranks.json은 사이트 미사용 운영 데이터 → build/deploy 없음.
on:
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '측정 건수 (기본 25)'
        required: false
        default: '25'

concurrency:
  group: naver-rank
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rank:
    name: Measure Naver SERP positions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ref 없이 두면 실행이 "예약된 시점"의 커밋이 고정된다. 앞선 회차가 끝나기를
      # 기다렸다가 시작한 실행은 그 회차의 push를 못 보고 옛 파일 위에 작업하게 된다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Check ranks
        run: node scripts/naver-rank-check.mjs --limit=${{ github.event.inputs.limit || '25' }}

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain src/data/naver-ranks.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No rank change — skipping commit"
          fi

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "awoo-bot"
          git config user.email "noreply@awoo.or.kr"
          MSG="chore(rank): $(TZ=Asia/Seoul date +'%m/%d') 네이버 순위 측정

          [skip ci]"
          git add src/data/naver-ranks.json
          git commit -m "$MSG"

          # 실행에 수 분이 걸려 그 사이 다른 회차가 push할 수 있다. 이 파일은
          # "이전 상태 + 이번 회차"라 어느 한쪽을 고르면 회차가 통째로 날아간다.
          # 그래서 원격을 base로 삼고 우리 결과를 다시 얹는다.
          for i in 1 2 3; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin main; then exit 0; fi
            fi
            echo "원격이 앞서 있다 — 병합 후 재시도 ($i/3)"
            cp src/data/naver-ranks.json "$RUNNER_TEMP/ours.json"
            git reset --hard origin/main
            node scripts/merge-data-store.mjs src/data/naver-ranks.json "$RUNNER_TEMP/ours.json"
            git add src/data/naver-ranks.json
            if ! git commit -m "$MSG"; then
              echo "병합 결과가 원격과 동일 — 적재할 것 없음"
              exit 0
            fi
          done
          echo "::error::3회 시도 후에도 push 실패"
          exit 1
